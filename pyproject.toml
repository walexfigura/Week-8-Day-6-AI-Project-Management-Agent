[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "northstar-project-manager-agent"
version = "1.0.0"
description = "Educational AI Project Manager agent (Week 8, Day 6 of 10 Weeks to AI Agents). Fictional data, mock integrations."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Alex Figura" }]
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
charts = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.scripts]
northstar-pm = "project_manager_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"
